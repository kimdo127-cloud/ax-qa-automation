<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한빛수학 · 신청 내역</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1 class="page-title">신청 내역</h1>
  <nav class="tabs">
    <a class="tab" href="courses.html">수강 신청</a>
    <a class="tab active" href="history.html">신청 내역</a>
  </nav>
  <div id="history-list"></div>
</main>
<script>
  var list = JSON.parse(localStorage.getItem('applied') || '[]');
  var box = document.getElementById('history-list');
  if (!list.length) {
    box.innerHTML = '<p class="empty">신청한 수업이 없습니다.</p>';
  } else {
    box.innerHTML = list.map(function (n) {
      return '<div class="card"><div><p class="card-name">' + n + '</p><p class="card-meta">신청 접수</p></div></div>';
    }).join('');
  }
</script>
</body>
</html>
