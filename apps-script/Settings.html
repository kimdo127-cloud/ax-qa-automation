<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", Arial, sans-serif; font-size: 13px; color: #191F28; margin: 0; padding: 4px 8px; }
  label { display: block; color: #4E5968; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #D1D6DB; border-radius: 8px; padding: 8px; font-size: 13px; }
  .hint { color: #8B95A1; font-size: 12px; margin-top: 3px; }
  button { width: 100%; margin-top: 16px; height: 38px; border: 0; border-radius: 8px; background: #3182F6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 10px; color: #1B64DA; }
</style>
</head>
<body>
  <div class="hint">비밀 값은 이 스프레드시트의 스크립트 속성에만 저장되고, 시트 화면에는 나오지 않습니다. 비워 두면 기존 값을 유지합니다.</div>
  <label>OpenAI API 키 <span id="s-openai"></span></label>
  <input id="openai" type="password" autocomplete="off">
  <div class="hint">OpenAI 키가 있으면 OpenAI를 쓰고, 없으면 Gemini를 씁니다.</div>
  <label>Gemini API 키 <span id="s-gemini"></span></label>
  <input id="gemini" type="password" autocomplete="off">
  <label>GitHub 토큰 (Actions 실행용) <span id="s-github"></span></label>
  <input id="github" type="password" autocomplete="off">
  <label>피그마 토큰 <span id="s-figma"></span></label>
  <input id="figma" type="password" autocomplete="off">
  <label>GitHub 저장소</label>
  <input id="repo">
  <label>웹앱 주소 (배포 후 /exec 주소)</label>
  <input id="webappUrl">
  <label>Gemini 모델</label>
  <input id="model">
  <button onclick="save()">저장</button>
  <div id="msg"></div>
<script>
  function fill(s) {
    ['openai', 'gemini', 'github', 'figma'].forEach(function (k) {
      document.getElementById('s-' + k).textContent = s[k] ? '(저장됨)' : '(미입력)';
      document.getElementById(k).value = '';
    });
    document.getElementById('repo').value = s.repo;
    document.getElementById('webappUrl').value = s.webappUrl;
    document.getElementById('model').value = s.model;
  }
  function save() {
    var f = {};
    ['openai', 'gemini', 'github', 'figma', 'repo', 'webappUrl', 'model'].forEach(function (k) { f[k] = document.getElementById(k).value; });
    google.script.run.withSuccessHandler(function (s) {
      fill(s);
      document.getElementById('msg').textContent = '저장했습니다. QA 실행 창을 다시 열면 상태가 갱신됩니다.';
    }).withFailureHandler(function (e) { document.getElementById('msg').textContent = '오류: ' + e.message; }).saveSettings(f);
  }
  google.script.run.withSuccessHandler(fill).getSettingsStatus();
</script>
</body>
</html>
