<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", Arial, sans-serif; font-size: 13px; color: #191F28; margin: 0; padding: 14px; background: #F9FAFB; }
  .warn { background: #FFF3E0; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: none; }
  .card { background: #fff; border: 1px solid #E5E8EB; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .num { width: 22px; height: 22px; border-radius: 50%; background: #191F28; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .done .num { background: #1B7F3B; }
  .badge { margin-left: auto; font-size: 11px; font-weight: 500; color: #1B7F3B; background: #E8F5E9; border-radius: 10px; padding: 2px 8px; display: none; }
  label { display: block; color: #4E5968; font-size: 12px; margin: 8px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #D1D6DB; border-radius: 8px; padding: 9px; font-size: 13px; font-family: inherit; }
  textarea { height: 96px; resize: vertical; }
  button { width: 100%; height: 42px; border: 0; border-radius: 10px; background: #3182F6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #D1D6DB; cursor: default; }
  button.ghost { background: #F2F4F6; color: #333D4B; height: 36px; font-size: 13px; margin-top: 8px; }
  button.alert { background: #FFF3E0; color: #C2410C; height: 36px; font-size: 13px; margin-top: 8px; display: none; }
  .msg { margin-top: 10px; font-size: 12px; line-height: 1.6; white-space: pre-line; color: #4E5968; }
  .msg.ok { color: #1B7F3B; } .msg.err { color: #C2410C; }
  .desc { color: #8B95A1; font-size: 12px; margin: -2px 0 10px; }
  .foot { text-align: center; margin-top: 6px; }
  .foot a { color: #8B95A1; font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <div class="warn" id="warn">처음 한 번 키 설정이 필요합니다. 아래 <b>설정</b>을 눌러 주세요.</div>

  <div class="card" id="c1">
    <div class="head"><span class="num">1</span>무엇을 테스트할까요?</div>
    <label>피그마 링크</label>
    <input id="figmaUrl" placeholder="https://www.figma.com/design/...">
    <label>테스트할 화면 주소</label>
    <input id="targetUrl" placeholder="https://.../index.html">
    <label>화면 동작 메모 (테스트 계정, 버튼을 누르면 어떻게 되는지)</label>
    <textarea id="memo" placeholder="예)&#10;테스트 계정 parent@test.com / 1234&#10;로그인하면 수강 신청 화면으로 이동&#10;비밀번호가 틀리면 오류 문구 표시"></textarea>
  </div>

  <div class="card" id="c2">
    <div class="head"><span class="num">2</span>테스트 만들기<span class="badge" id="b2"></span></div>
    <div class="desc">AI가 피그마를 보고 확인할 항목을 만듭니다. (약 1~2분)<br>처음 한 번, 또는 기획이 바뀌었을 때만 누르세요.</div>
    <button id="genBtn" onclick="gen()">테스트 만들기</button>
    <button class="alert" id="applyBtn" onclick="applyEdits()">수정한 테스트 반영</button>
    <div class="msg" id="m2"></div>
  </div>

  <div class="card" id="c3">
    <div class="head"><span class="num">3</span>QA 실행<span class="badge" id="b3"></span></div>
    <div class="desc">실제 브라우저가 화면을 눌러 보고, 문제를 결함 탭에 적습니다. (약 1~2분)<br>2차부터는 이 버튼만 누르면 됩니다. 개발자가 '수정완료'라고 적은 건은 다시 확인해 진짜 고쳐진 것만 종료합니다.</div>
    <button id="runBtn" onclick="run()">QA 실행</button>
    <div class="msg" id="m3"></div>
    <button class="ghost" id="goDefect" style="display:none" onclick="google.script.run.openSheet('결함')">결함 탭 보기</button>
  </div>

  <div class="foot"><a onclick="google.script.run.showSettings()">설정 (키 입력)</a></div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  function msg(id, t, cls) { var m = $(id); m.className = 'msg ' + (cls || ''); m.textContent = t; }
  var busy = false;

  function refresh(prefill) {
    google.script.run.withSuccessHandler(function (s) {
      $('warn').style.display = (s.settings.gemini && s.settings.github && s.settings.webappUrl) ? 'none' : 'block';
      if (prefill && s.input) {
        if (!$('figmaUrl').value) $('figmaUrl').value = s.input.figmaUrl || '';
        if (!$('targetUrl').value) $('targetUrl').value = s.input.targetUrl || '';
        if (!$('memo').value) $('memo').value = s.input.memo || '';
      }
      if (s.testcases) { $('c2').classList.add('done'); $('b2').style.display = 'inline'; $('b2').textContent = '테스트 ' + s.testcases + '개'; }
      $('applyBtn').style.display = s.edited ? 'block' : 'none';
      if (s.edited) $('applyBtn').textContent = '수정한 테스트 반영 (' + s.edited + '건)';
      $('b3').style.display = s.testcases ? 'inline' : 'none';
      $('b3').textContent = '다음: ' + s.nextRound + '차';
      $('runBtn').disabled = busy || !s.testcases || !!s.edited || !!s.running;
      $('genBtn').disabled = busy || !!s.running;
      if (!s.testcases) msg('m3', '먼저 2번에서 테스트를 만드세요.');
      else if (s.edited) msg('m3', '고친 테스트가 있습니다. 2번의 "수정한 테스트 반영"을 먼저 누르세요.');
      if (s.running && !timer) { started = Date.now(); msg('m3', 'QA 실행 중…'); timer = setInterval(function () { poll(s.running); }, 6000); }
    }).getPanelState();
  }

  function progressTimer(id, t0) {
    return setInterval(function () {
      google.script.run.withSuccessHandler(function (p) {
        if (busy) msg(id, '진행 중… ' + Math.round((Date.now() - t0) / 1000) + '초\n' + p.replace(/^\S+ \S+ /, ''));
      }).getProgress();
    }, 4000);
  }

  function gen() {
    if (!$('targetUrl').value.trim()) { msg('m2', '테스트할 화면 주소를 먼저 입력하세요.', 'err'); return; }
    if ($('b2').style.display === 'inline' && !confirm('테스트를 새로 만들면 지금 테스트와 차수 기록은 백업으로 옮겨지고, 진행 중인 결함은 "확인 필요"로 바뀝니다. 계속할까요?')) return;
    busy = true; $('genBtn').disabled = true; $('runBtn').disabled = true;
    var pt = progressTimer('m2', Date.now());
    var fail = function (e) { busy = false; clearInterval(pt); msg('m2', '문제가 생겼습니다: ' + e.message, 'err'); refresh(); };
    google.script.run.withSuccessHandler(function () {
      google.script.run.withSuccessHandler(function (r) {
        busy = false; clearInterval(pt);
        var t = '완료 · 확인 항목 ' + r.ia + '개 · 테스트 ' + r.testcases + '개';
        if (r.skipped.length) t += '\n일부 시나리오(' + r.skipped.join(', ') + ')는 만들지 못했습니다. 필요하면 다시 누르세요.';
        if (r.detached) t += '\n진행 중이던 결함 ' + r.detached + '건은 "확인 필요"로 바뀌었습니다.';
        msg('m2', t, 'ok');
        google.script.run.openSheet('테스트케이스');
        refresh();
      }).withFailureHandler(fail).generateTestCases();
    }).withFailureHandler(fail).generateTestDesign({
      figmaUrl: $('figmaUrl').value, targetUrl: $('targetUrl').value, memo: $('memo').value
    });
  }

  function applyEdits() {
    busy = true; $('applyBtn').disabled = true; $('runBtn').disabled = true;
    var pt = progressTimer('m2', Date.now());
    google.script.run.withSuccessHandler(function (r) {
      busy = false; clearInterval(pt); $('applyBtn').disabled = false;
      msg('m2', '반영 완료 · ' + r.updated + '건' + (r.failed.length ? '\n반영 못 한 테스트: ' + r.failed.join(', ') + ' (다시 누르세요)' : ''), r.failed.length ? 'err' : 'ok');
      refresh();
    }).withFailureHandler(function (e) {
      busy = false; clearInterval(pt); $('applyBtn').disabled = false; msg('m2', '문제가 생겼습니다: ' + e.message, 'err'); refresh();
    }).applyEditedTests();
  }

  var timer = null, started = 0;
  function run() {
    busy = true; $('runBtn').disabled = true; $('genBtn').disabled = true;
    $('goDefect').style.display = 'none';
    msg('m3', '시작하는 중…');
    google.script.run.withSuccessHandler(function (r) {
      started = Date.now();
      msg('m3', r.round + '차 QA 실행 중… 브라우저가 화면을 눌러 보고 있습니다.');
      timer = setInterval(function () { poll(r.runId); }, 6000);
    }).withFailureHandler(function (e) { busy = false; msg('m3', '문제가 생겼습니다: ' + e.message, 'err'); refresh(); }).startQaRun();
  }

  function poll(runId) {
    google.script.run.withSuccessHandler(function (s) {
      if (s.status === '실행 중') { msg('m3', s.round + ' QA 실행 중… ' + Math.round((Date.now() - started) / 1000) + '초'); return; }
      clearInterval(timer); timer = null; busy = false;
      if (s.status === '완료') {
        var t = s.round + ' QA 완료 · 통과 ' + s.pass + ' / 문제 ' + s.fail;
        if (s.newDefects) t += '\n새로 기록된 결함 ' + s.newDefects + '건';
        if (s.verified || s.reopened) t += '\n재확인: 종료 ' + s.verified + '건 · 재오픈 ' + s.reopened + '건';
        msg('m3', t, s.fail ? '' : 'ok');
        $('goDefect').style.display = 'block';
        google.script.run.openSheet('요약');
      } else if (s.status === '시간 초과') {
        msg('m3', '결과가 ' + 15 + '분 안에 오지 않아 이번 실행은 실패로 처리했습니다. 다시 눌러 주세요.', 'err');
      } else {
        msg('m3', '문제가 생겼습니다: ' + s.status, 'err');
      }
      refresh();
    }).getRunStatus(runId);
  }

  refresh(true);
</script>
</body>
</html>
