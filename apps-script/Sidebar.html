<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root { --blue: #3182F6; --blue-bg: #E8F3FF; --g900: #191F28; --g700: #4E5968; --g500: #8B95A1; --g300: #D1D6DB; --g200: #E5E8EB; --g100: #F2F4F6; --g50: #F9FAFB;
          --red: #F04452; --red-bg: #FFEEEE; --amber: #D97706; --amber-bg: #FFF6E5; --green: #1B7F3B; --green-bg: #E8F5E9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", Arial, sans-serif; font-size: 13px; color: var(--g900); background: var(--g50); display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; padding: 14px 14px 8px; }
  .foot { flex: none; background: #fff; border-top: 1px solid var(--g200); padding: 12px 14px 14px; box-shadow: 0 -4px 12px rgba(0,0,0,.04); }

  /* 진행 상황 */
  .prog { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: none; }
  .prog-h { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; }
  .prog-h small { font-weight: 500; color: var(--g500); font-size: 12px; }
  .bar { height: 4px; background: var(--g100); border-radius: 2px; margin: 10px 0 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 2px; transition: width .4s; }
  .step { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--g500); font-size: 12.5px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--g300); flex: none; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
  .step.now { color: var(--g900); font-weight: 600; } .step.now .dot { border-color: var(--blue); background: var(--blue-bg); animation: pulse 1.2s infinite; }
  .step.ok { color: var(--g700); } .step.ok .dot { border-color: var(--green); background: var(--green); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(49,130,246,.15); } }
  .note { margin-top: 8px; font-size: 12px; color: var(--g700); background: var(--g50); border-radius: 8px; padding: 8px 10px; white-space: pre-line; }
  .prog.err .note { background: var(--red-bg); color: #B42318; }
  .prog.ok .note { background: var(--green-bg); color: var(--green); }

  /* 목록 */
  .sec { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin: 4px 2px 4px; }
  .pill { font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 8px; }
  .pill.blue { background: var(--blue-bg); color: var(--blue); } .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .sub { color: var(--g500); font-size: 12px; margin: 0 2px 10px; line-height: 1.5; }
  .empty { background: #fff; border: 1px dashed var(--g300); border-radius: 12px; padding: 14px; text-align: center; color: var(--g500); font-size: 12px; margin-bottom: 18px; }
  .item { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .id { font-size: 11px; font-weight: 700; color: var(--g500); }
  .name { font-size: 13px; font-weight: 600; margin-top: 2px; line-height: 1.4; }
  .scr { font-size: 11.5px; color: var(--g500); margin-top: 2px; }
  .seg { display: flex; background: var(--g100); border-radius: 8px; padding: 2px; flex: none; }
  .seg span { padding: 4px 8px; font-size: 11px; font-weight: 600; color: var(--g500); border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .seg span.on { background: #fff; color: var(--g900); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .detail { margin-top: 10px; border-top: 1px solid var(--g100); padding-top: 10px; display: none; }
  .kv { font-size: 12px; margin-bottom: 8px; }
  .kv b { display: block; font-size: 11px; color: var(--g500); font-weight: 600; margin-bottom: 2px; }
  .kv div { white-space: pre-line; line-height: 1.5; }
  .links { display: flex; gap: 6px; margin-bottom: 8px; }
  .links a, .links span { font-size: 12px; color: var(--blue); text-decoration: none; cursor: pointer; font-weight: 600; }
  .acts { display: flex; gap: 6px; }
  .acts button { flex: 1; height: 34px; border: 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .b-green { background: var(--green-bg); color: var(--green); } .b-red { background: var(--red-bg); color: #B42318; } .b-gray { background: var(--g100); color: var(--g700); }
  .ai { width: 100%; height: 38px; border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin: 2px 0 18px; display: none; }
  .ai:disabled { border-color: var(--g300); color: var(--g500); }

  /* 하단 버튼 */
  .primary { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .primary:disabled { background: var(--g300); cursor: default; }
  .secondary { width: 100%; height: 36px; border: 0; background: transparent; color: var(--g700); font-size: 12.5px; font-weight: 600; cursor: pointer; margin-top: 6px; border-radius: 10px; }
  .secondary:hover { background: var(--g100); }
</style>
</head>
<body>
  <div class="scroll">
    <div class="prog" id="prog">
      <div class="prog-h"><span id="progTitle">QA 실행 중</span><small id="elapsed"></small></div>
      <div class="bar"><i id="barFill"></i></div>
      <div id="steps"></div>
      <div class="note" id="note" style="display:none"></div>
    </div>

    <div class="sec">재확인 대기 <span class="pill blue" id="nFixed">0</span></div>
    <div class="sub">개발자가 '수정완료'로 표시한 이슈입니다. AI가 다시 눌러 볼지, 직접 확인할지 고르세요.</div>
    <div id="fixed"></div>
    <button class="ai" id="aiBtn" onclick="recheck()"></button>

    <div class="sec">기획자 확인 필요 <span class="pill amber" id="nCheck">0</span></div>
    <div class="sub">테스트가 화면 요소를 찾지 못한 건입니다. 직접 보고 실제 이슈인지 판정하세요.</div>
    <div id="check"></div>
  </div>

  <div class="foot">
    <button class="primary" id="fullBtn" onclick="fullRun()">전체 QA 실행</button>
    <button class="secondary" onclick="google.script.run.showRunDialog()">테스트 대상 변경</button>
  </div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var busy = false, timer = null, pt = null, t0 = 0, stepList = [], stepNow = 0, nextRound = 1, hasTests = 0;

  /* ── 진행 상황 ── */
  function showSteps(list, title) {
    stepList = list; stepNow = 0; t0 = Date.now();
    $('prog').className = 'prog'; $('prog').style.display = 'block';
    $('progTitle').textContent = title; $('note').style.display = 'none';
    drawSteps();
    clearInterval(pt);
    pt = setInterval(function () {
      $('elapsed').textContent = Math.round((Date.now() - t0) / 1000) + '초';
      google.script.run.withSuccessHandler(function (p) {
        if (busy && p) { $('note').style.display = 'block'; $('note').textContent = p.replace(/^\S+ \S+ /, ''); }
      }).getProgress();
    }, 3000);
  }
  function drawSteps() {
    $('steps').innerHTML = stepList.map(function (s, i) {
      var c = i < stepNow ? 'ok' : i === stepNow ? 'now' : '';
      return '<div class="step ' + c + '"><span class="dot">' + (i < stepNow ? '✓' : '') + '</span>' + esc(s) + '</div>';
    }).join('');
    $('barFill').style.width = Math.round(stepNow / stepList.length * 100) + '%';
  }
  function next() { stepNow++; drawSteps(); }
  function finish(text, ok) {
    busy = false; clearInterval(pt); clearInterval(timer); timer = null;
    if (ok) stepNow = stepList.length;
    drawSteps();
    $('prog').className = 'prog ' + (ok ? 'ok' : 'err');
    $('progTitle').textContent = ok ? '완료' : '진행하지 못했습니다';
    $('note').style.display = 'block'; $('note').textContent = text;
    load();
  }
  function fail(e) { finish(String(e.message || e).replace(/^Error:\s*/, ''), false); }

  /* ── QA 실행 팝업에서 넘어온 작업 ── */
  function runJob(job) {
    busy = true; lock();
    var list = [];
    if (job.needGen) list.push('테스트 만들기');
    if (!job.needGen && job.edited) list.push('고친 테스트 반영');
    list.push('화면 눌러 보기'); list.push('결과 기록');
    showSteps(list, 'QA 실행 중');
    var gen = function (cb) {
      if (!job.needGen) return cb();
      google.script.run.withSuccessHandler(function () {
        google.script.run.withSuccessHandler(function () { next(); cb(); }).withFailureHandler(fail).generateTestCases();
      }).withFailureHandler(fail).generateTestDesign(job);
    };
    var apply = function (cb) {
      if (job.needGen || !job.edited) return cb();
      google.script.run.withSuccessHandler(function () { next(); cb(); }).withFailureHandler(fail).applyEditedTests();
    };
    gen(function () { apply(function () { start({}); }); });
  }

  function start(opts) {
    google.script.run.withSuccessHandler(function (r) {
      $('progTitle').textContent = r.round + ' 실행 중';
      timer = setInterval(function () { poll(r.runId); }, 6000);
    }).withFailureHandler(fail).startQaRun(opts);
  }

  function poll(runId) {
    google.script.run.withSuccessHandler(function (s) {
      if (s.status === '실행 중') return;
      if (String(s.status).indexOf('완료') === 0) {
        next();
        var t = '통과 ' + s.pass + ' · 문제 ' + s.fail;
        if (s.newDefects) t += ' · 새 이슈 ' + s.newDefects;
        if (s.verified || s.reopened) t += '\n재확인: 종료 ' + s.verified + ' · 재오픈 ' + s.reopened;
        finish(t, true);
        google.script.run.openSheet('요약');
      } else if (s.status === '시간 초과') {
        finish('15분 안에 결과가 오지 않았습니다. 다시 실행해 주세요.', false);
      } else {
        finish(String(s.status).replace(/^오류:\s*/, ''), false);
      }
    }).getRunStatus(runId);
  }

  function lock() {
    $('fullBtn').disabled = busy || !hasTests;
    $('aiBtn').disabled = busy;
  }

  /* ── 재확인 대기 · 확인 필요 ── */
  var review = { fixed: [], check: [] };
  function load() {
    google.script.run.withSuccessHandler(function (s) {
      review = s.review; nextRound = s.nextRound; hasTests = s.testcases;
      $('fullBtn').textContent = hasTests ? '전체 QA 실행 · ' + nextRound + '차' : '전체 QA 실행';
      draw(); lock();
      if (s.running && !timer && !busy) {
        busy = true; lock();
        showSteps(['화면 눌러 보기', '결과 기록'], s.runningRound + ' 실행 중');
        timer = setInterval(function () { poll(s.running); }, 6000);
      }
    }).getPanelState();
  }

  function card(d, kind) {
    var manual = kind === 'check' || d.method === '직접';
    var h = '<div class="item"><div class="item-top"><div><div class="id">' + esc(d.id) + (d.screen ? ' · ' + esc(d.screen) : '') + '</div><div class="name">' + esc(d.title) + '</div></div>';
    if (kind === 'fixed') h += '<div class="seg"><span class="' + (manual ? '' : 'on') + '" data-id="' + esc(d.id) + '" data-m="AI">AI</span><span class="' + (manual ? 'on' : '') + '" data-id="' + esc(d.id) + '" data-m="직접">직접</span></div>';
    h += '</div><div class="detail" style="display:' + (manual ? 'block' : 'none') + '">' +
      '<div class="kv"><b>재현 절차</b><div>' + esc(d.steps) + '</div></div>' +
      '<div class="kv"><b>기대 결과</b><div>' + esc(d.expected) + '</div></div>' +
      '<div class="kv"><b>지난 실제 결과</b><div>' + esc(d.actual) + '</div></div>' +
      '<div class="links"><a href="' + esc(d.page) + '" target="_blank">화면 열기 ↗</a>' + (d.shot ? '<a href="' + esc(d.shot) + '" target="_blank">실패 화면 ↗</a>' : '') + '<span data-row="' + esc(d.id) + '">시트에서 보기</span></div><div class="acts">';
    if (kind === 'fixed') h += '<button class="b-green" data-v="통과" data-id="' + esc(d.id) + '">고쳐짐 · 종료</button><button class="b-red" data-v="재오픈" data-id="' + esc(d.id) + '">안 고쳐짐</button>';
    else h += '<button class="b-red" data-v="이슈 맞음" data-id="' + esc(d.id) + '">실제 이슈</button><button class="b-gray" data-v="제외" data-id="' + esc(d.id) + '">테스트 오류</button>';
    return h + '</div><div class="note" style="display:none"></div></div></div>';
  }

  function draw() {
    $('nFixed').textContent = review.fixed.length; $('nCheck').textContent = review.check.length;
    $('fixed').innerHTML = review.fixed.length ? review.fixed.map(function (d) { return card(d, 'fixed'); }).join('') : '<div class="empty">재확인할 이슈가 없습니다</div>';
    $('check').innerHTML = review.check.length ? review.check.map(function (d) { return card(d, 'check'); }).join('') : '<div class="empty">판정할 건이 없습니다</div>';
    var ai = review.fixed.filter(function (d) { return d.method !== '직접'; });
    $('aiBtn').style.display = ai.length ? 'block' : 'none';
    $('aiBtn').textContent = 'AI로 ' + ai.length + '건 재확인';
    lock();
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset.m) {
      review.fixed.forEach(function (d) { if (d.id === t.dataset.id) d.method = t.dataset.m; });
      draw(); google.script.run.setCheckMethod(t.dataset.id, t.dataset.m);
    } else if (t.dataset.v) {
      t.disabled = true;
      google.script.run.withSuccessHandler(function (r) { review = r; draw(); })
        .withFailureHandler(function (err) { t.disabled = false; var n = t.closest('.item').querySelector('.note'); n.style.display = 'block'; n.textContent = err.message; })
        .manualVerdict(t.dataset.id, t.dataset.v);
    } else if (t.dataset.row) {
      google.script.run.openDefectRow(t.dataset.row);
    }
  });

  function recheck() {
    var ai = review.fixed.filter(function (d) { return d.method !== '직접'; });
    if (!ai.length) return;
    busy = true; lock();
    showSteps(['수정완료 ' + ai.length + '건 다시 눌러 보기', '결과 기록'], '재확인 실행 중');
    start({ only: ai.map(function (d) { return String(d.tc).trim(); }) });
  }

  function fullRun() {
    busy = true; lock();
    google.script.run.withSuccessHandler(function (n) {
      showSteps((n ? ['고친 테스트 반영'] : []).concat(['화면 눌러 보기', '결과 기록']), nextRound + '차 QA 실행 중');
      if (n) google.script.run.withSuccessHandler(function () { next(); start({}); }).withFailureHandler(fail).applyEditedTests();
      else start({});
    }).withFailureHandler(fail).countEditedTests();
  }

  google.script.run.withSuccessHandler(function (job) {
    if (job) runJob(job);
    load();
  }).takeJob();
</script>
</body>
</html>
