<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", Arial, sans-serif; font-size: 13px; color: #191F28; margin: 0; padding: 14px; background: #F9FAFB; }
  .warn { background: #FFF3E0; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: none; }
  .card { background: #fff; border: 1px solid #E5E8EB; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .num { width: 22px; height: 22px; border-radius: 50%; background: #191F28; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .done .num { background: #1B7F3B; }
  label { display: block; color: #4E5968; font-size: 12px; margin: 8px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #D1D6DB; border-radius: 8px; padding: 9px; font-size: 13px; font-family: inherit; }
  textarea { height: 96px; resize: vertical; }
  button { width: 100%; height: 42px; border: 0; border-radius: 10px; background: #3182F6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #D1D6DB; cursor: default; }
  button.ghost { background: #F2F4F6; color: #333D4B; height: 36px; font-size: 13px; margin-top: 8px; }
  .msg { margin-top: 10px; font-size: 12px; line-height: 1.6; white-space: pre-line; color: #4E5968; }
  .msg.ok { color: #1B7F3B; } .msg.err { color: #C2410C; }
  .desc { color: #8B95A1; font-size: 12px; margin: -2px 0 10px; }
  .foot { text-align: center; margin-top: 6px; }
  .foot a { color: #8B95A1; font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <div class="warn" id="warn">처음 한 번 키 설정이 필요합니다. 아래 <b>설정</b>을 눌러 주세요.</div>

  <div class="card" id="c1">
    <div class="head"><span class="num">1</span>무엇을 테스트할까요?</div>
    <label>피그마 링크</label>
    <input id="figmaUrl" placeholder="https://www.figma.com/design/...">
    <label>테스트할 화면 주소</label>
    <input id="targetUrl" placeholder="https://.../index.html">
    <label>화면 동작 메모 (테스트 계정, 버튼을 누르면 어떻게 되는지)</label>
    <textarea id="memo" placeholder="예)&#10;테스트 계정 parent@test.com / 1234&#10;로그인하면 수강 신청 화면으로 이동&#10;비밀번호가 틀리면 오류 문구 표시"></textarea>
  </div>

  <div class="card" id="c2">
    <div class="head"><span class="num">2</span>테스트 만들기</div>
    <div class="desc">AI가 피그마를 보고 확인할 항목을 만듭니다. (약 1~2분)</div>
    <button id="genBtn" onclick="gen()">테스트 만들기</button>
    <div class="msg" id="m2"></div>
  </div>

  <div class="card" id="c3">
    <div class="head"><span class="num">3</span>QA 실행</div>
    <div class="desc">실제 브라우저가 화면을 눌러 보고, 문제를 결함 탭에 적습니다. (약 1~2분)<br>개발자가 '수정완료'라고 적은 건은 다시 확인해 진짜 고쳐진 것만 종료합니다.</div>
    <button id="runBtn" onclick="run()">QA 실행</button>
    <div class="msg" id="m3"></div>
    <button class="ghost" id="goDefect" style="display:none" onclick="google.script.run.openSheet('결함')">결함 탭 보기</button>
  </div>

  <div class="foot"><a onclick="google.script.run.showSettings()">설정 (키 입력)</a></div>

<script>
  function msg(id, t, cls) { var m = document.getElementById(id); m.className = 'msg ' + (cls || ''); m.textContent = t; }
  google.script.run.withSuccessHandler(function (s) {
    if (!(s.gemini && s.github && s.webappUrl)) document.getElementById('warn').style.display = 'block';
  }).getSettingsStatus();

  function gen() {
    var b = document.getElementById('genBtn'); b.disabled = true;
    var t0 = Date.now();
    msg('m2', '만드는 중…');
    var pt = setInterval(function () {
      google.script.run.withSuccessHandler(function (p) {
        if (b.disabled) msg('m2', '만드는 중… ' + Math.round((Date.now() - t0) / 1000) + '초\n' + p.replace(/^\S+ \S+ /, ''));
      }).getProgress();
    }, 4000);
    var fail = function (e) { b.disabled = false; clearInterval(pt); msg('m2', '문제가 생겼습니다: ' + e.message, 'err'); };
    google.script.run.withSuccessHandler(function () {
      google.script.run.withSuccessHandler(function (r) {
        b.disabled = false; clearInterval(pt);
        document.getElementById('c2').classList.add('done');
        msg('m2', '완료 · 확인 항목 ' + r.ia + '개 · 테스트 ' + r.testcases + '개\n테스트케이스 탭에서 확인할 수 있습니다.', 'ok');
        google.script.run.openSheet('테스트케이스');
      }).withFailureHandler(fail).generateTestCases();
    }).withFailureHandler(fail).generateTestDesign({
      figmaUrl: document.getElementById('figmaUrl').value,
      targetUrl: document.getElementById('targetUrl').value,
      memo: document.getElementById('memo').value
    });
  }

  var timer = null, started = 0;
  function run() {
    var b = document.getElementById('runBtn'); b.disabled = true;
    document.getElementById('goDefect').style.display = 'none';
    msg('m3', '시작하는 중…');
    google.script.run.withSuccessHandler(function (r) {
      started = Date.now();
      msg('m3', r.round + '차 QA 실행 중… 브라우저가 화면을 눌러 보고 있습니다.');
      timer = setInterval(function () { poll(r.runId); }, 6000);
    }).withFailureHandler(function (e) { b.disabled = false; msg('m3', '문제가 생겼습니다: ' + e.message, 'err'); }).startQaRun();
  }
  function poll(runId) {
    google.script.run.withSuccessHandler(function (s) {
      var b = document.getElementById('runBtn');
      if (s.status === '완료') {
        clearInterval(timer); b.disabled = false;
        var t = s.round + ' QA 완료 · 통과 ' + s.pass + ' / 실패 ' + s.fail;
        if (s.newDefects) t += '\n새 결함 ' + s.newDefects + '건';
        if (s.verified || s.reopened) t += '\n재확인: 종료 ' + s.verified + '건 · 재오픈 ' + s.reopened + '건';
        msg('m3', t, s.fail ? '' : 'ok');
        document.getElementById('goDefect').style.display = 'block';
        google.script.run.openSheet('요약');
      } else if (/^(오류|시작 실패)/.test(String(s.status))) {
        clearInterval(timer); b.disabled = false; msg('m3', '문제가 생겼습니다: ' + s.status, 'err');
      } else {
        msg('m3', s.round + ' QA 실행 중… ' + Math.round((Date.now() - started) / 1000) + '초');
      }
    }).getRunStatus(runId);
  }
</script>
</body>
</html>
