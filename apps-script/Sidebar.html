<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", Arial, sans-serif; font-size: 13px; color: #191F28; margin: 0; padding: 12px; background: #F9FAFB; }
  .card { background: #fff; border: 1px solid #E5E8EB; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .title { font-weight: 700; font-size: 14px; margin: 14px 2px 8px; display: flex; align-items: center; gap: 6px; }
  .cnt { background: #191F28; color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; }
  .desc { color: #8B95A1; font-size: 12px; margin: -4px 2px 8px; }
  .steps div { padding: 3px 0; color: #8B95A1; }
  .steps .now { color: #191F28; font-weight: 600; }
  .steps .ok { color: #1B7F3B; }
  .prog { margin-top: 6px; font-size: 12px; color: #4E5968; white-space: pre-line; }
  .item-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .item-h b { font-size: 13px; }
  .meta { font-size: 11.5px; color: #8B95A1; margin-top: 2px; }
  .seg { display: flex; border: 1px solid #D1D6DB; border-radius: 8px; overflow: hidden; flex: none; }
  .seg span { padding: 4px 8px; font-size: 11.5px; cursor: pointer; color: #4E5968; }
  .seg span.on { background: #191F28; color: #fff; }
  .detail { margin-top: 8px; font-size: 12px; background: #F9FAFB; border-radius: 8px; padding: 8px; white-space: pre-line; display: none; }
  .detail b { display: block; color: #4E5968; margin-top: 4px; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  button { border: 0; border-radius: 8px; height: 34px; font-size: 12.5px; font-weight: 600; cursor: pointer; flex: 1; }
  .pri { background: #3182F6; color: #fff; width: 100%; height: 40px; font-size: 13.5px; }
  .pri:disabled { background: #D1D6DB; }
  .gray { background: #F2F4F6; color: #333D4B; }
  .green { background: #E8F5E9; color: #1B7F3B; }
  .red { background: #FFF3E0; color: #C2410C; }
  a.btn { flex: 1; text-align: center; line-height: 34px; height: 34px; border-radius: 8px; background: #F2F4F6; color: #333D4B; font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .empty { color: #8B95A1; font-size: 12px; padding: 4px 2px 8px; }
  .done { color: #1B7F3B; } .err { color: #C2410C; }
  .foot { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
  <div class="card" id="progCard" style="display:none">
    <div style="font-weight:700" id="progTitle">진행 상황</div>
    <div class="steps" id="steps"></div>
    <div class="prog" id="prog"></div>
  </div>

  <div class="title">재확인 대기 <span class="cnt" id="nFixed">0</span></div>
  <div class="desc">개발자가 '수정완료'로 표시한 결함입니다. AI가 다시 눌러 볼지, 직접 확인할지 고르세요.</div>
  <div id="fixed"></div>
  <button class="pri" id="aiBtn" onclick="recheck()" style="display:none"></button>

  <div class="title">기획자 확인 필요 <span class="cnt" id="nCheck">0</span></div>
  <div class="desc">테스트가 화면 요소를 찾지 못한 건입니다. 직접 보고 실제 결함인지 판정하세요.</div>
  <div id="check"></div>

  <div class="foot">
    <button class="gray" id="fullBtn" onclick="fullRun()">전체 QA 다시 실행</button>
    <button class="gray" onclick="google.script.run.showRunDialog()">QA 실행 창 (테스트 대상 변경)</button>
  </div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var busy = false, timer = null, pt = null, t0 = 0, stepList = [], stepNow = 0;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  /* ── 진행 상황 ── */
  function showSteps(list, title) {
    stepList = list; stepNow = 0; t0 = Date.now();
    $('progCard').style.display = 'block'; $('progTitle').textContent = title; $('progTitle').className = '';
    drawSteps();
    clearInterval(pt);
    pt = setInterval(function () {
      google.script.run.withSuccessHandler(function (p) {
        if (busy) $('prog').textContent = Math.round((Date.now() - t0) / 1000) + '초 · ' + p.replace(/^\S+ \S+ /, '');
      }).getProgress();
    }, 4000);
  }
  function drawSteps() {
    $('steps').innerHTML = stepList.map(function (s, i) {
      return '<div class="' + (i < stepNow ? 'ok' : i === stepNow ? 'now' : '') + '">' + (i < stepNow ? '✓ ' : i === stepNow ? '● ' : '○ ') + esc(s) + '</div>';
    }).join('');
  }
  function next() { stepNow++; drawSteps(); }
  function finish(text, ok) {
    busy = false; clearInterval(pt); clearInterval(timer); timer = null;
    stepNow = ok ? stepList.length : stepNow; drawSteps();
    $('progTitle').textContent = ok ? '완료' : '문제가 생겼습니다'; $('progTitle').className = ok ? 'done' : 'err';
    $('prog').textContent = text;
    load();
  }
  function fail(e) { finish(e.message || String(e), false); }

  /* ── 팝업에서 넘어온 실행 ── */
  function runJob(job) {
    busy = true; lock(true);
    var list = [];
    if (job.needGen) list.push('테스트 만들기 (AI가 피그마와 화면을 읽음)');
    if (!job.needGen && job.edited) list.push('고친 테스트 반영');
    list.push('화면 눌러 보기 (실제 브라우저)');
    list.push('결과 기록');
    showSteps(list, 'QA 실행 중');
    var gen = function (cb) {
      if (!job.needGen) return cb();
      google.script.run.withSuccessHandler(function () {
        google.script.run.withSuccessHandler(function (r) {
          $('prog').textContent = '테스트 ' + r.testcases + '개 만듦' + (r.skipped.length ? ' (일부 시나리오 미작성)' : '');
          next(); cb();
        }).withFailureHandler(fail).generateTestCases();
      }).withFailureHandler(fail).generateTestDesign(job);
    };
    var apply = function (cb) {
      if (job.needGen || !job.edited) return cb();
      google.script.run.withSuccessHandler(function () { next(); cb(); }).withFailureHandler(fail).applyEditedTests();
    };
    gen(function () { apply(function () { start({}); }); });
  }

  function start(opts) {
    google.script.run.withSuccessHandler(function (r) {
      $('progTitle').textContent = r.round + ' 실행 중';
      timer = setInterval(function () { poll(r.runId); }, 6000);
    }).withFailureHandler(fail).startQaRun(opts);
  }

  function poll(runId) {
    google.script.run.withSuccessHandler(function (s) {
      if (s.status === '실행 중') return;
      if (String(s.status).indexOf('완료') === 0) {
        var t = '통과 ' + s.pass + ' · 문제 ' + s.fail;
        if (s.newDefects) t += ' · 새 결함 ' + s.newDefects;
        if (s.verified || s.reopened) t += '\n재확인: 종료 ' + s.verified + ' · 재오픈 ' + s.reopened;
        finish(t + '\n자세한 내용은 요약 · 결함 탭에 있습니다.', true);
        google.script.run.openSheet('요약');
      } else if (s.status === '시간 초과') {
        finish('15분 안에 결과가 오지 않아 실패로 처리했습니다. 다시 실행해 주세요.', false);
      } else {
        finish(s.status, false);
      }
    }).getRunStatus(runId);
  }

  function lock(on) { $('fullBtn').disabled = on; $('aiBtn').disabled = on; }

  /* ── 재확인 대기 · 확인 필요 목록 ── */
  var review = { fixed: [], check: [] };
  function load() {
    google.script.run.withSuccessHandler(function (s) {
      review = s.review;
      draw();
      if (s.running && !timer && !busy) {
        busy = true; lock(true);
        showSteps(['화면 눌러 보기 (실제 브라우저)', '결과 기록'], s.runningRound + ' 실행 중');
        timer = setInterval(function () { poll(s.running); }, 6000);
      }
      $('fullBtn').textContent = '전체 QA 다시 실행 (' + s.nextRound + '차)';
      $('fullBtn').disabled = busy || !s.testcases;
    }).getPanelState();
  }

  function item(d, kind) {
    var manual = kind === 'check' || d.method === '직접';
    var h = '<div class="card" id="c-' + d.id + '"><div class="item-h"><div><b>' + esc(d.id) + '</b> · ' + esc(d.screen) +
      '<div class="meta">' + esc(d.title) + '</div></div>';
    if (kind === 'fixed') h += '<div class="seg"><span class="' + (manual ? '' : 'on') + '" onclick="method(\'' + d.id + '\',\'AI\')">AI 확인</span><span class="' + (manual ? 'on' : '') + '" onclick="method(\'' + d.id + '\',\'직접\')">직접 확인</span></div>';
    h += '</div><div class="detail" style="display:' + (manual ? 'block' : 'none') + '"><b>재현 절차</b>' + esc(d.steps) + '<b>기대 결과</b>' + esc(d.expected) + '<b>지난 실제 결과</b>' + esc(d.actual) +
      '<div class="row"><a class="btn" href="' + esc(d.page) + '" target="_blank">화면 열기</a>' + (d.shot ? '<a class="btn" href="' + esc(d.shot) + '" target="_blank">실패 화면</a>' : '') +
      '<button class="gray" onclick="google.script.run.openDefectRow(\'' + d.id + '\')">결함 행</button></div><div class="row">';
    if (kind === 'fixed') h += '<button class="green" onclick="verdict(\'' + d.id + '\',\'통과\')">고쳐짐 · 종료</button><button class="red" onclick="verdict(\'' + d.id + '\',\'재오픈\')">안 고쳐짐 · 재오픈</button>';
    else h += '<button class="red" onclick="verdict(\'' + d.id + '\',\'결함 맞음\')">실제 결함</button><button class="gray" onclick="verdict(\'' + d.id + '\',\'제외\')">테스트 오류 · 제외</button>';
    return h + '</div></div></div>';
  }

  function draw() {
    $('nFixed').textContent = review.fixed.length; $('nCheck').textContent = review.check.length;
    $('fixed').innerHTML = review.fixed.length ? review.fixed.map(function (d) { return item(d, 'fixed'); }).join('') : '<div class="empty">재확인할 결함이 없습니다.</div>';
    $('check').innerHTML = review.check.length ? review.check.map(function (d) { return item(d, 'check'); }).join('') : '<div class="empty">판정할 건이 없습니다.</div>';
    var ai = review.fixed.filter(function (d) { return d.method !== '직접'; });
    $('aiBtn').style.display = ai.length ? 'block' : 'none';
    $('aiBtn').textContent = 'AI 확인 ' + ai.length + '건 재확인 실행';
    $('aiBtn').disabled = busy;
  }

  function method(id, m) {
    review.fixed.forEach(function (d) { if (d.id === id) d.method = m; });
    draw();
    google.script.run.setCheckMethod(id, m);
  }

  function verdict(id, v) {
    google.script.run.withSuccessHandler(function (r) { review = r; draw(); }).withFailureHandler(function (e) { var c = document.getElementById('c-' + id); if (c) c.insertAdjacentHTML('beforeend', '<div class="prog err">' + esc(e.message) + '</div>'); }).manualVerdict(id, v);
  }

  function recheck() {
    var ai = review.fixed.filter(function (d) { return d.method !== '직접'; });
    if (!ai.length) return;
    busy = true; lock(true);
    showSteps(['수정완료 ' + ai.length + '건 다시 눌러 보기', '결과 기록'], '재확인 실행 중');
    start({ only: ai.map(function (d) { return String(d.tc).trim(); }) });
  }

  function fullRun() {
    busy = true; lock(true);
    showSteps(['화면 눌러 보기 (실제 브라우저)', '결과 기록'], 'QA 실행 중');
    google.script.run.withSuccessHandler(function (n) {
      if (n) { stepList.unshift('고친 테스트 반영'); drawSteps();
        google.script.run.withSuccessHandler(function () { next(); start({}); }).withFailureHandler(fail).applyEditedTests();
      } else start({});
    }).withFailureHandler(fail).countEditedTests();
  }

  /* ── 시작 ── */
  google.script.run.withSuccessHandler(function (job) {
    if (job) runJob(job);
    load();
  }).takeJob();
</script>
</body>
</html>
